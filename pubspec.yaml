name: mobilepos
description: a mobile pos that is easy and ready to use
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^17.1.0

  # Networking
  internet_connection_checker_plus: ^2.9.1+2
  dio: ^5.9.2

  # State Management
  fpdart: ^1.2.0
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1

  # Backend – Firebase

  # Backend – Supabase

  # Backend – Appwrite

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.1

  # Images & SVG
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4

  # Icons
  flutter_remix: ^0.0.3

  # Shimmer / Skeleton
  skeletonizer: ^2.1.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1

  # Environment
  flutter_dotenv: ^6.0.0

  # Logging
  logger: ^2.6.2

  # Media

  # Utilities
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1

  # Device & System
  device_info_plus: ^11.2.0
  app_version_update: ^6.2.0

  #icons
  hugeicons: ^1.1.5
  # Localization
  easy_localization: ^3.0.8

  flutter_native_splash: ^2.4.7
  drift: ^2.34.3
  dev: ^1.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev:
  build_runner: ^2.15.1

  # Code Generation

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - .env

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/font/satoshi/Satoshi-Light.otf
          weight: 200
        - asset: assets/font/satoshi/Satoshi-Light.otf
          weight: 300
        - asset: assets/font/satoshi/Satoshi-Regular.otf
          weight: 400
        - asset: assets/font/satoshi/Satoshi-Medium.otf
          weight: 500
        - asset: assets/font/satoshi/Satoshi-Bold.otf
          weight: 600
        - asset: assets/font/satoshi/Satoshi-Bold.otf
          weight: 700
        - asset: assets/font/satoshi/Satoshi-Black.otf
          weight: 800
    - family: Segoe
      fonts:

        - asset: assets/font/segoe_ui/segoeuil.ttf
          weight: 300
        - asset: assets/font/segoe_ui/segoeuisl.ttf
          weight: 400
        - asset: assets/font/segoe_ui/segoeui.ttf
          weight: 500
        - asset: assets/font/segoe_ui/segoeuib.ttf
          weight: 600
        - asset: assets/font/segoe_ui/segoeuib.ttf
          weight: 700
        - asset: assets/font/segoe_ui/seguibl.ttf
          weight: 800
